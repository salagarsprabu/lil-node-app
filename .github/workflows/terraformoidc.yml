name: Terraform AWS OIDC GITHUB Demo
on:
  push:
    branches: [ "main" ]
env:
  AWS_REGION : "us-east-1"   
  WORK_DIR: ./Terraform  # Set your working directory globally
permissions:
      id-token: write
      contents: read

jobs:
  OIDC:
    name: 'OIDC'
    runs-on: ubuntu-latest
    environment: oidc
    defaults:
      run:
        shell: bash
        working-directory: ./Terraform
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v3
      # Set up AWS credentials-
      - name: Set up AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
     
      - name: Terraform format
        id: fmt
        run: terraform fmt
        working-directory: ${{ env.WORK_DIR}}

      - name: Terraform Initialization
        id: init
        run: terraform init
        working-directory: ${{ env.WORK_DIR}}

      - name: Terraform Validate
        id: validate
        run: |
          terraform validate > validate_output.txt
          echo "::set-output name=stdout::$(cat validate_output.txt)"
        working-directory: ${{ env.WORK_DIR}}  

      - name: Terraform Plan
        id: plan
        run: terraform plan > plan_output.txt
        working-directory: ${{ env.WORK_DIR}}

      - name: Review Terraform Status
        uses: actions/github-script@v6
        with:
          script: |
            const outcomeFmt = `${{ steps.fmt.outcome || 'unknown' }}`;
            const outcomeInit = `${{ steps.init.outcome || 'unknown' }}`;
            const outcomeValidate = `${{ steps.validate.outcome || 'unknown' }}`;
            const outcomePlan = `${{ steps.plan.outcome || 'unknown' }}`;

            // Check the actual outputs from the steps
            const validateOutput = steps.validate.outputs.stdout || 'No output'; 
            
            console.log(`Terraform Format and Style 🖌: ${outcomeFmt}`);
            console.log(`Terraform Initialization ⚙️: ${outcomeInit}`);
            console.log(`Terraform Validation 🤖: ${outcomeValidate}`);
            console.log(`Terraform Plan 📝: ${outcomePlan}`);
            
            const detailsMarkup = `
            <details>
              <summary>Validation Output</summary>
              \`\`\`
              ${validateOutput}
              \`\`\`
            </details>
            `;
            console.log(detailsMarkup);

                      
      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve
        working-directory: ${{ env.WORK_DIR}}
        
      - name: Terraform Output
        run: terraform output
        working-directory: ${{ env.WORK_DIR}}
